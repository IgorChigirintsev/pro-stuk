flutter_launcher_icons:
  android: true
  ios: true
  # iOS не терпит прозрачности в значке приложения: с альфа-каналом App Store
  # отвергает сборку при загрузке.
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0E7C7B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
