services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /app/data
      TRUST_PROXY: "1"  # api стоит за Caddy — X-Forwarded-For доверяем
    volumes:
      - ./data:/app/data
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    # Caddy не получает секреты: из .env ему нужен только домен.
    environment:
      DOMAIN_API: ${DOMAIN_API}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
