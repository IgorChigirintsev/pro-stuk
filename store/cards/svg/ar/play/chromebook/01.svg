<text x="933" y="862" text-anchor="end" font-family="Manrope, Inter, sans-serif"
        font-size="38" font-weight="600" fill="#0F172A">رمان بلي الدينامو</text>
      <text x="227" y="862" text-anchor="start" font-family="Manrope, Inter, sans-serif"
        font-size="38" font-weight="700" fill="#0F172A">45%</text>
      <rect x="227" y="885.3333333333334" width="706" height="13.333333333333334" rx="6.666666666666667" fill="#D7EAE7"/>
      <rect x="227" y="885.3333333333334" width="318" height="13.333333333333334"
        rx="6.666666666666667" fill="#0E7C7B"/>
<text x="933" y="978" text-anchor="end" font-family="Manrope, Inter, sans-serif"
        font-size="38" font-weight="600" fill="#0F172A">بكرة الشداد</text>
      <text x="227" y="978" text-anchor="start" font-family="Manrope, Inter, sans-serif"
        font-size="38" font-weight="700" fill="#0F172A">30%</text>
      <rect x="227" y="1001.3333333333334" width="706" height="13.333333333333334" rx="6.666666666666667" fill="#D7EAE7"/>
      <rect x="227" y="1001.3333333333334" width="212" height="13.333333333333334"
        rx="6.666666666666667" fill="#0E7C7B"/>
<text x="933" y="1095" text-anchor="end" font-family="Manrope, Inter, sans-serif"
        font-size="38" font-weight="600" fill="#0F172A">رمان بلي طرمبة الماء</text>
      <text x="227" y="1095" text-anchor="start" font-family="Manrope, Inter, sans-serif"
        font-size="38" font-weight="700" fill="#0F172A">15%</text>
      <rect x="227" y="1118.3333333333333" width="706" height="13.333333333333334" rx="6.666666666666667" fill="#D7EAE7"/>
      <rect x="227" y="1118.3333333333333" width="106" height="13.333333333333334"
        rx="6.666666666666667" fill="#0E7C7B"/>
  </g>

  <g id="Сноска">
    <text x="580" y="1300" text-anchor="middle" font-family="Manrope, Inter, sans-serif"
      font-size="38" font-weight="600" fill="#fff" opacity="0.92">بلا جهاز فحص وبلا ورشة.</text>
    <text x="580" y="1365" text-anchor="middle" font-family="Manrope, Inter, sans-serif"
      font-size="38" font-weight="600" fill="#fff" opacity="0.92">هاتفك يكفي.</text>
  </g>
</svg>