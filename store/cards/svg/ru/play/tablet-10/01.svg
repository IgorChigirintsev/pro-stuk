<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1600" height="2560" viewBox="0 0 1600 2560">
  <defs>
    <linearGradient id="hue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.0000" stop-color="#1BB3A6"/>
      <stop offset="0.2000" stop-color="#19A57F"/>
      <stop offset="0.4000" stop-color="#149A9B"/>
      <stop offset="0.6000" stop-color="#1183A6"/>
      <stop offset="0.8000" stop-color="#0F8F86"/>
      <stop offset="1.0000" stop-color="#17AD97"/>
    </linearGradient>
    <radialGradient id="blob">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#001A18" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-10%" width="160%" height="130%">
      <feDropShadow dx="0" dy="30" stdDeviation="46" flood-color="#00201E" flood-opacity="0.6"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="325" y="580" width="950" height="2100" rx="50"/>
    </clipPath>
  </defs>

  <g id="Фон">
    <g id="Лента" transform="translate(0,0)">
      <rect width="12800" height="2560" fill="url(#hue)"/>
      <circle cx="1840" cy="282"
              r="672" fill="url(#blob)" opacity="0.1"/>
      <circle cx="4640" cy="2074"
              r="928" fill="url(#blob)" opacity="0.08"/>
      <circle cx="6480" cy="179"
              r="592" fill="url(#blob)" opacity="0.1"/>
      <circle cx="9280" cy="2278"
              r="1056" fill="url(#blob)" opacity="0.07"/>
      <circle cx="11360" cy="333"
              r="720" fill="url(#blob)" opacity="0.09"/>
    </g>
    <rect width="1600" height="2560" fill="url(#fade)"/>
  </g>

  <g id="Волна">
<rect x="685" y="153" width="14"
              height="44" rx="7" fill="#fff" opacity="0.9"/><rect x="721" y="137" width="14"
              height="76" rx="7" fill="#fff" opacity="0.9"/><rect x="757" y="149" width="14"
              height="52" rx="7" fill="#fff" opacity="0.9"/><rect x="793" y="113" width="14"
              height="124" rx="7" fill="#fff" opacity="0.9"/><rect x="829" y="142" width="14"
              height="66" rx="7" fill="#fff" opacity="0.9"/><rect x="865" y="128" width="14"
              height="94" rx="7" fill="#fff" opacity="0.9"/><rect x="901" y="156" width="14"
              height="38" rx="7" fill="#fff" opacity="0.9"/>
  </g>

  <g id="Подпись">
      <text x="800" y="315" text-anchor="middle"
        font-family="Manrope, Inter, -apple-system, sans-serif"
        font-size="88" font-weight="800" letter-spacing="-1.5"
        fill="#FFFFFF"
        >Диагностика по звуку</text>
      <text x="800" y="427" text-anchor="middle"
        font-family="Manrope, Inter, -apple-system, sans-serif"
        font-size="88" font-weight="800" letter-spacing="-1.5"
        fill="#FFD166"
        >без сканера</text>
  </g>

  <g id="Машина">
<path d="M 1011 649 A 328 328 0 0 1 1011 1151"
              fill="none" stroke="#fff" stroke-width="15.3125" stroke-linecap="round" opacity="0.75"/><path d="M 589 649 A 328 328 0 0 0 589 1151"
              fill="none" stroke="#fff" stroke-width="15.3125" stroke-linecap="round" opacity="0.75"/><path d="M 1066 583 A 413 413 0 0 1 1066 1217"
              fill="none" stroke="#fff" stroke-width="15.3125" stroke-linecap="round" opacity="0.53"/><path d="M 534 583 A 413 413 0 0 0 534 1217"
              fill="none" stroke="#fff" stroke-width="15.3125" stroke-linecap="round" opacity="0.53"/><path d="M 1121 518 A 499 499 0 0 1 1121 1282"
              fill="none" stroke="#fff" stroke-width="15.3125" stroke-linecap="round" opacity="0.31"/><path d="M 479 518 A 499 499 0 0 0 479 1282"
              fill="none" stroke="#fff" stroke-width="15.3125" stroke-linecap="round" opacity="0.31"/>
    <g transform="translate(800 900) scale(1.6953125)">
      <path d="M-150 20 q6-58 40-64 l30-46 q10-16 30-16 h100 q20 0 30 16 l30 46
               q34 6 40 64 v24 q0 14-14 14 h-272 q-14 0-14-14 z" fill="#fff"/>
      <circle cx="-92" cy="58" r="30" fill="#fff"/>
      <circle cx="92" cy="58" r="30" fill="#fff"/>
    </g>
  </g>

  <g id="Результат">
    <rect x="275" y="1420" width="1050" height="722" rx="53" fill="#fff"/>
    <rect x="336" y="1481" width="429"
      height="79" rx="39" fill="#D2790B"/>
    <text x="550" y="1535" text-anchor="middle"
      font-family="Manrope, Inter, sans-serif" font-size="42" font-weight="700"
      fill="#fff">В сервис на неделе</text>
    <text x="336" y="1639" font-family="Manrope, Inter, sans-serif"
      font-size="37" font-weight="600" fill="#64748B">Вероятные причины</text>
<text x="336" y="1737" text-anchor="start" font-family="Manrope, Inter, sans-serif"
        font-size="50" font-weight="600" fill="#0F172A">Подшипник генератора</text>
      <text x="1264" y="1737" text-anchor="end" font-family="Manrope, Inter, sans-serif"
        font-size="50" font-weight="700" fill="#0F172A">45%</text>
      <rect x="336" y="1767.625" width="928" height="17.5" rx="8.75" fill="#D7EAE7"/>
      <rect x="336" y="1767.625" width="418" height="17.5"
        rx="8.75" fill="#0E7C7B"/>
<text x="336" y="1890" text-anchor="start" font-family="Manrope, Inter, sans-serif"
        font-size="50" font-weight="600" fill="#0F172A">Ролик натяжителя</text>
      <text x="1264" y="1890" text-anchor="end" font-family="Manrope, Inter, sans-serif"
        font-size="50" font-weight="700" fill="#0F172A">30%</text>
      <rect x="336" y="1920.625" width="928" height="17.5" rx="8.75" fill="#D7EAE7"/>
      <rect x="336" y="1920.625" width="278" height="17.5"
        rx="8.75" fill="#0E7C7B"/>
<text x="336" y="2043" text-anchor="start" font-family="Manrope, Inter, sans-serif"
        font-size="50" font-weight="600" fill="#0F172A">Подшипник помпы</text>
      <text x="1264" y="2043" text-anchor="end" font-family="Manrope, Inter, sans-serif"
        font-size="50" font-weight="700" fill="#0F172A">15%</text>
      <rect x="336" y="2073.625" width="928" height="17.5" rx="8.75" fill="#D7EAE7"/>
      <rect x="336" y="2073.625" width="139" height="17.5"
        rx="8.75" fill="#0E7C7B"/>
  </g>

  <g id="Сноска">
    <text x="800" y="2339" text-anchor="middle" font-family="Manrope, Inter, sans-serif"
      font-size="50" font-weight="600" fill="#fff" opacity="0.92">Без сканера и без сервиса.</text>
    <text x="800" y="2424" text-anchor="middle" font-family="Manrope, Inter, sans-serif"
      font-size="50" font-weight="600" fill="#fff" opacity="0.92">Только телефон.</text>
  </g>
</svg>